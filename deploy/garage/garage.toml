# Configuração do Garage para desenvolvimento local (nó único, sem replicação).
# Credenciais iniciais vêm das variáveis GARAGE_DEFAULT_* do docker-compose/.env.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "0d15b0e21f66d4c0d3aa4a4e62f9d1ff710d38604126a9e5173e8fd0eab1a6b4"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "maraberto-dev-admin-token-local"
metrics_token = "maraberto-dev-metrics-token-local"
