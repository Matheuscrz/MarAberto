name: Bug
description: Relatar um problema reproduzível no projeto.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: O que aconteceu e o que você esperava que acontecesse?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Como reproduzir
      description: Liste os passos mínimos para reproduzir o problema.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      description: Informe sistema operacional, navegador e versões relevantes.
  - type: textarea
    id: evidence
    attributes:
      label: Evidências
      description: Inclua logs ou imagens sem dados pessoais, segredos ou localizações exatas.
