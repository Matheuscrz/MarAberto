name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Backend (Gradle + Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle com cache
        uses: gradle/actions/setup-gradle@v6
        with:
          # Provider MIT baseado em actions/cache, sem dependência de serviço proprietário
          cache-provider: basic

      - name: Compilar código de produção e de testes
        run: ./gradlew compileJava compileTestJava

      - name: Executar testes unitários, de modularidade e de integração
        run: ./gradlew clean check

      - name: Publicar relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-teste
          path: backend/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: Frontend (Lint + Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Verificar lint e fronteiras de features
        run: npm run lint

      - name: Compilar TypeScript e gerar bundle de produção
        run: npm run build
