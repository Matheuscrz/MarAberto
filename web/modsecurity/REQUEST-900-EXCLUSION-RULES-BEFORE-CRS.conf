# Exclusões cirúrgicas do OWASP ModSecurity CRS para fluxos legítimos do MarAberto.
# Mantém PARANOIA=1 e ANOMALY_INBOUND=5 ativos para todo o restante da aplicação.

# 1. Importação de KML/KMZ (/api/v1/management/bathing-areas/import)
# Arquivos KML contêm XML (<Placemark>, <Polygon>, <coordinates>, <ExtendedData>)
# que disparam falsos positivos de XSS/SQLi (941xxx/942xxx) e Content-Type.
# A proteção real contra XXE e validação de esquema ocorre em KmlFeatureReader.java.
SecRule REQUEST_URI "@beginsWith /api/v1/management/bathing-areas/import" \
    "id:9001001,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveByTag=attack-xss,\
    ctl:ruleRemoveByTag=attack-sqli,\
    ctl:ruleRemoveById=920420"

# 2. Upload de mídia (/api/v1/media)
# Aceita multipart/form-data e JSON base64 (app Capacitor); payloads base64 longos
# podem acionar heurísticas de SQLi/XSS/protocolo (941xxx/942xxx/920273).
# O backend re-codifica toda imagem via ImageNormalizer (remove EXIF e payloads).
SecRule REQUEST_URI "@beginsWith /api/v1/media" \
    "id:9001002,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveById=941100-941399,\
    ctl:ruleRemoveById=942100-942599,\
    ctl:ruleRemoveById=920273"

# 3. Handshake WebSocket STOMP (/ws)
# Requisições Upgrade: websocket podem omitir Accept ou usar cabeçalhos de
# upgrade que acionam regras de anomalia de protocolo (920300/920420/911100).
# A autorização de origem e JWT é aplicada em WebSocketConfig e StompAuthenticationInterceptor.
SecRule REQUEST_URI "@beginsWith /ws" \
    "id:9001003,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveById=920300,\
    ctl:ruleRemoveById=920420,\
    ctl:ruleRemoveById=911100"
