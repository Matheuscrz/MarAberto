# Servidor do PWA MarAberto (build estático + proxy da API).
#
# A CSP é restritiva de propósito: o app não usa script inline, eval, fontes
# externas nem imagens de terceiros. Vídeos do YouTube só são permitidos no
# frame, a partir do domínio youtube-nocookie.com. Se algum recurso novo exigir
# outra origem, atualize a CSP junto com a revisão de segurança.
server {
    listen 80;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    # MapLibre v6 usa um web worker (pode vir de blob:) e o protocolo PMTiles
    # pode criar Object URLs para tiles workers: `blob:` só em worker-src e img-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self' blob:" always;

    # HSTS só deve ser habilitado quando o site é servido por HTTPS.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # A API nunca é cacheada pelo Nginx; o backend também envia no-store para
    # SOS e autenticação. Requisições não-GET também não são cacheadas.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
        # Não usar `expires` aqui: preserva o Cache-Control enviado pelo backend
        # (no-store para SOS e autenticação).
    }

    # Console do operador: STOMP sobre WebSocket. O upgrade do protocolo é
    # obrigatório e a leitura fica aberta (sem proxy_read_timeout curto), senão
    # a conexão cai a cada 15 s. A autorização é do frame CONNECT (JWT), não do
    # Nginx. A CSP `connect-src 'self'` cobre o WebSocket de mesma origem.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Assets com hash no nome podem ser cacheados por um ano.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # O mime.types do Nginx não mapeia `.mjs`: sem este bloco o worker do
    # MapLibre é servido como application/octet-stream e o navegador recusa.
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location /icons/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # O service worker precisa ser revalidado para permitir atualização.
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
        try_files $uri =404;
    }

    # HTML e arquivos de shell não podem ficar presos em cache antigo.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location = /offline.html {
        expires -1;
        try_files $uri =404;
    }
}
