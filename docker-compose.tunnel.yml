# Extensão para testes públicos via Cloudflare Quick Tunnel.
# Uso: docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d --build

services:
  backend:
    environment:
      # `native`: o Tomcat só aceita `X-Forwarded-*` de proxy de faixa interna,
      # que é o caso do nginx desta stack. `framework` faria o backend confiar no
      # cabeçalho de qualquer cliente — e a porta 8080 é publicada no host, o que
      # permitiria forjar o IP e escapar do rate limit e do lockout do login.
      FORWARD_HEADERS_STRATEGY: native
      # Permite WebSocket STOMP e requisições vindas da URL pública do túnel
      REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS:-http://localhost:3000}
      # Ativa usuários e postos de demonstração para o QA conseguir logar e testar.
      # O túnel é público: com `true`, as contas `@maraberto.dev` (senha `demo1234`)
      # e os postos demo ficam acessíveis para quem tiver a URL.
      IDENTITY_DEV_SEED: ${IDENTITY_DEV_SEED:-true}
      OPERATIONS_DEV_SEED: ${OPERATIONS_DEV_SEED:-true}

  web:
    volumes:
      # Sobrescreve apenas no container de teste o nginx.conf original
      - ./web/nginx.tunnel.conf:/etc/nginx/conf.d/default.conf:ro

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: maraberto-tunnel
    command: tunnel --no-autoupdate --url http://web:80
    depends_on:
      - web
    restart: unless-stopped