# A outbox é exercitada explicitamente pelos testes (publicação após commit e
# `publishPending`). Um sweep periódico em contexto Spring mantido em cache
# continuaria rodando durante as classes seguintes e reivindicaria eventos de
# outro teste — o PostGIS é compartilhado por toda a JVM.
maraberto.emergency.outbox.sweep-interval=PT1H
maraberto.emergency.outbox.sweep-initial-delay=PT1H

# O job de inatividade do plantão é exercitado explicitamente pelos testes;
# um sweep periódico em contexto mantido em cache encerraria plantões de outra
# classe (o PostGIS é compartilhado por toda a JVM).
maraberto.dispatch.shift-sweep-interval=PT1H
maraberto.dispatch.shift-sweep-initial-delay=PT1H

# O escalonamento do SOS é exercitado explicitamente pelos testes (abrir anel
# não pode acontecer sozinho durante outra classe, porque o PostGIS é
# compartilhado por toda a JVM).
maraberto.dispatch.escalation.sweep-interval=PT1H
maraberto.dispatch.escalation.sweep-initial-delay=PT1H

# O job de reconciliação das ocorrências é exercitado explicitamente pelos
# testes; um sweep periódico em contexto mantido em cache abriria ocorrências
# de outra classe (o PostGIS é compartilhado por toda a JVM).
maraberto.occurrences.reconciliation.delay=PT1H
maraberto.occurrences.reconciliation.initial-delay=PT1H

# Vários contextos Spring (um por classe) compartilham o mesmo PostGIS de teste;
# um pool grande por contexto esgota as conexões do servidor.
spring.datasource.hikari.maximum-pool-size=4

# Os testes não dependem do Garage: o storage fica em memória e o arquivamento
# do KML é verificado pelo que o stub registra.
maraberto.storage.provider=stub
