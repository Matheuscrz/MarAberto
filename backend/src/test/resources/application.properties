# A outbox é exercitada explicitamente pelos testes (publicação após commit e
# `publishPending`). Um sweep periódico em contexto Spring mantido em cache
# continuaria rodando durante as classes seguintes e reivindicaria eventos de
# outro teste — o PostGIS é compartilhado por toda a JVM.
maraberto.emergency.outbox.sweep-interval=PT1H
maraberto.emergency.outbox.sweep-initial-delay=PT1H

# O job de inatividade do plantão é exercitado explicitamente pelos testes;
# um sweep periódico em contexto mantido em cache encerraria plantões de outra
# classe (o PostGIS é compartilhado por toda a JVM).
maraberto.dispatch.shift-sweep-interval=PT1H
maraberto.dispatch.shift-sweep-initial-delay=PT1H
