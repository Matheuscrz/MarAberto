# Perfil de produção. Suba com `SPRING_PROFILES_ACTIVE=prod`.
#
# As validações de boot recusam: chave de cifragem/JWT de desenvolvimento, seed
# de dev, storage `stub` e cookie de refresh sem `Secure`.

server:
  forward-headers-strategy: native

# Swagger e o documento OpenAPI são ferramenta de desenvolvimento: em produção
# eles expõem o contrato inteiro da API a quem alcançar o host. O
# `SecurityConfig` libera essas rotas sem autenticação, então o desligamento vem
# do springdoc — com ele `false` os endpoints respondem 404, em vez de 200.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

maraberto:
  security:
    cookie:
      # Em produção o refresh token só trafega por HTTPS. A aplicação falha ao
      # subir com `false` (SecuritySettingsConfiguration).
      secure: true
      # Obrigatório: `SECURITY_ALLOWED_ORIGINS=https://<domínio>,https://localhost,
      # capacitor://localhost`. Sem a variável o boot falha em
      # SecuritySettingsConfiguration com mensagem explícita, em vez de aceitar a
      # lista de desenvolvimento e responder 403 no domínio real.
