spring:
  application:
    name: maraberto-backend

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/maraberto}
    username: ${DB_USER:maraberto}
    password: ${DB_PASSWORD:maraberto}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  mvc:
    problemdetails:
      enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Limites defensivos para reduzir superfície de abuso (DoS, payloads gigantes).
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # Redis é opcional para os fluxos que ainda não dependem dele. A conexão é
  # criada de forma preguiçosa pelo Lettuce; sem Redis, a aplicação sobe e
  # apenas os recursos que usam cache/rate limit ficam degradados.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s

maraberto:
  storage:
    # `stub` guarda só metadados em memória; `s3` fala com o Garage local
    # (ADR-006). O padrão é o S3 de desenvolvimento, recusado no perfil `prod`
    # quando as credenciais de exemplo ainda estiverem em uso.
    provider: ${STORAGE_PROVIDER:s3}
    s3:
      endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:9000}
      region: ${STORAGE_S3_REGION:garage}
      access-key: ${STORAGE_S3_ACCESS_KEY:maraberto-access-key}
      secret-key: ${STORAGE_S3_SECRET_KEY:maraberto-secret-key}
      # Garage e MinIO não resolvem o bucket por DNS: o caminho é
      # `endpoint/bucket/chave`.
      path-style: ${STORAGE_S3_PATH_STYLE:true}
  realtime:
    # Origens aceitas no handshake do WebSocket. Inclui localhost e 127.0.0.1
    # porque o navegador trata os dois como origens distintas no dev local.
    allowed-origins: ${REALTIME_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  dispatch:
    # Raio padrão de cobertura quando o posto/base não define o seu (metros).
    default-coverage-radius-m: ${DISPATCH_DEFAULT_COVERAGE_RADIUS_M:2000}
    # Teto de distância da notificação (metros). O raio do posto/base pode ser
    # menor, nunca maior: um cadastro errado não pode chamar quem está longe
    # demais. Fora do teto, o chamado vai para a coordenação.
    max-radius-m: ${DISPATCH_MAX_RADIUS_M:15000}
    # Idade a partir da qual a última posição do plantão é considerada velha.
    position-stale-after: ${DISPATCH_POSITION_STALE_AFTER:PT30M}
    # Teto de segurança por rodada. Todos os plantões dentro do raio são
    # notificados; o teto só evita fan-out absurdo por raio mal configurado.
    max-recipients: ${DISPATCH_MAX_RECIPIENTS:50}
    # Vizinhos mais próximos notificados quando ninguém está dentro do raio.
    fallback-recipients: ${DISPATCH_FALLBACK_RECIPIENTS:3}
    # Plantão sem sinal de vida (app fechado, sem rede ou sem GPS) é encerrado.
    # O console renova o sinal a cada 5 min enquanto está aberto e visível.
    shift-idle-timeout: ${DISPATCH_SHIFT_IDLE_TIMEOUT:PT15M}
    # Job de carimbo: só arruma `ended_at`/`ended_reason` das linhas vencidas.
    # A correção real já acontece nas consultas (expiração preguiçosa), então
    # este intervalo pode ser largo sem deixar o SOS chamar quem saiu.
    shift-sweep-interval: ${DISPATCH_SHIFT_SWEEP_INTERVAL:PT10M}
    shift-sweep-initial-delay: ${DISPATCH_SHIFT_SWEEP_INITIAL_DELAY:PT2M}
    escalation:
      # Escada de escalonamento (metros), na ordem em que os anéis são abertos
      # quando ninguém assume o chamado. O anel é absoluto: ignora o raio
      # cadastrado do posto/base, porque nesse momento o que importa é quem
      # consegue chegar. Esgotada a escada, a coordenação é acionada (RN03).
      rings: ${DISPATCH_ESCALATION_RINGS:5000,7000,10000,12000,15000,20000}
      # Tempo para o console tocar, o guarda-vidas olhar e assumir antes de
      # acordar mais gente (RF21/RF42 fixam 20 s como padrão). Ampliar antes
      # disso só adiciona quem chegaria depois.
      delay: ${DISPATCH_ESCALATION_DELAY:PT20S}
      # O intervalo é curto porque o anel é a resposta a "ninguém assumiu";
      # sem chamado vencido a consulta usa índice parcial e volta vazia.
      sweep-interval: ${DISPATCH_ESCALATION_SWEEP_INTERVAL:PT10S}
      sweep-initial-delay: ${DISPATCH_ESCALATION_SWEEP_INITIAL_DELAY:PT15S}
      batch-size: ${DISPATCH_ESCALATION_BATCH_SIZE:20}
  emergency:
    outbox:
      # Sweep de recuperação da outbox: intervalo curto porque o SOS tem
      # p95 < 3 s e o evento pode ter ficado pendente após uma queda.
      # @Scheduled aceita apenas ISO-8601 (PT5S), não "5s".
      sweep-interval: ${EMERGENCY_OUTBOX_SWEEP_INTERVAL:PT5S}
      sweep-initial-delay: ${EMERGENCY_OUTBOX_SWEEP_INITIAL_DELAY:PT10S}
      batch-size: ${EMERGENCY_OUTBOX_BATCH_SIZE:50}
      max-attempts: ${EMERGENCY_OUTBOX_MAX_ATTEMPTS:10}
      # Tempo de posse de um evento reivindicado. Passado o prazo, outra
      # instância (ou o sweep) pode reassumir a publicação.
      claim-lease: ${EMERGENCY_OUTBOX_CLAIM_LEASE:PT30S}
  security:
    crypto:
      # Chave de desenvolvimento (32 bytes em base64). NUNCA use em produção:
      # defina CRYPTO_MASTER_KEY com um segredo gerado e mantido fora do repositório.
      key-id: ${CRYPTO_KEY_ID:k1}
      master-key: ${CRYPTO_MASTER_KEY:ZGV2LW9ubHktbWFyYWJlcnRvLWtleS0zMmJ5dGVzISE=}
      # Rotação: adicione chaves antigas como mapa, por exemplo
      # previous-keys: { k0: "<base64>" } (ou MARABERTO_SECURITY_CRYPTO_PREVIOUS_KEYS_K0).
      previous-keys: {}
    jwt:
      # Segredo HMAC-SHA256 com no mínimo 32 bytes. O valor padrão é de
      # desenvolvimento e é recusado no perfil `prod`. Em qualquer ambiente
      # compartilhado, defina JWT_SECRET (ex.: openssl rand -base64 48).
      secret: ${JWT_SECRET:dev-only-maraberto-jwt-secret-32bytes!!}
      issuer: ${JWT_ISSUER:maraberto}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P7D}
      # Janela de tolerância para duas abas renovando ao mesmo tempo.
      refresh-reuse-tolerance: ${JWT_REFRESH_REUSE_TOLERANCE:PT10S}
  identity:
    dev-seed:
      # Contas de desenvolvimento para o login real das três áreas. Desligado
      # por padrão e recusado no perfil `prod`.
      enabled: ${IDENTITY_DEV_SEED:false}
  operations:
    dev-seed:
      # Posto fixo e base móvel de demonstração para abrir plantão e testar o
      # despacho sem o importador de mapeamento. Desligado por padrão e
      # recusado no perfil `prod`.
      enabled: ${OPERATIONS_DEV_SEED:false}
  beaches:
    import:
      # Caminho usado quando o endpoint recebe só `state` (importação assistida)
      # e pelo seed. O upload multipart tem prioridade.
      file: ${BATHING_AREAS_IMPORT_FILE:}
      # Arquivo original aplicado no storage de objetos (auditoria). A chave é
      # endereçada pelo SHA-256 do conteúdo: `<prefix>/<UF>/<sha256>.kml`.
      bucket: ${BATHING_AREAS_IMPORT_BUCKET:media-public}
      prefix: ${BATHING_AREAS_IMPORT_PREFIX:bathing-areas}
    dev-seed:
      # Importa o KML real de Sergipe quando `beaches` está vazia. Desligado por
      # padrão e recusado no perfil `prod`.
      enabled: ${BATHING_AREAS_DEV_SEED:false}
      file: ${BATHING_AREAS_SEED_FILE:docs/kml/Areas_Banho_Sergipe.kml}
      state: ${BATHING_AREAS_SEED_STATE:SE}

server:
  port: 8080
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 64KB
    max-swallow-size: 64KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
