spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_USER:maraberto}
    password: ${RABBITMQ_PASSWORD:maraberto}
    publisher-confirm-type: correlated
    publisher-returns: true

management:
  health:
    rabbit:
      enabled: true

maraberto:
  realtime:
    rabbit:
      confirm-timeout-ms: ${RABBITMQ_CONFIRM_TIMEOUT_MS:5000}
      retry-ttl-ms: ${RABBITMQ_RETRY_TTL_MS:5000}
      max-retries: ${RABBITMQ_MAX_RETRIES:3}
