plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

ext['testcontainers.version'] = '2.0.5'
group = 'com.maraberto'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web e API
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Persistência e monitoramento
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Arquitetura modular
    implementation platform('org.springframework.modulith:spring-modulith-bom:1.2.13')
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Suporte ao algoritmo Argon2id no Spring Security
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'

    // JJWT (Java JWT)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Cache distribuído e tempo real
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // Web Push (VAPID) — BouncyCastle já está presente para Argon2id
    implementation 'nl.martijndwars:web-push:5.1.1'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'

    // Armazenamento de objetos S3-compatível (Garage) — ADR-006
    implementation platform('software.amazon.awssdk:bom:2.58.0')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:url-connection-client'

    // Geoespacial (PostGIS) e migrações de esquema
    implementation 'org.hibernate.orm:hibernate-spatial'
    constraints {
        implementation('org.locationtech.jts:jts-core') {
            version {
                strictly '1.18.2'
            }
            because 'Evita resolução dinâmica de range [1.18.0, 1.19.0) via maven-metadata.xml no CI'
        }
    }
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Documentação da API (Swagger/OpenAPI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // Segurança: sanitização de HTML/entrada vinda da web
    implementation 'com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20261107.1'

    // Testes Unitários e Testes de Arquitetura
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'

    // Testes de integração
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.amqp:spring-rabbit-test'
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-rabbitmq'

    testImplementation 'org.apache.commons:commons-compress:1.26.1'
    testImplementation 'org.apache.commons:commons-lang3:3.14.0'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}